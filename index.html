const store = {
  get(key, fallback){
    try { return window.localStorage.getItem(key) ?? fallback; }
    catch { return fallback; }
  },
  set(key, value){
    try { window.localStorage.setItem(key, String(value)); }
    catch { /* ignore storage errors */ }
  }
};
let lang = store.get("lang", (navigator.language||"en").slice(0,2));

let repos = null, repoErr = false;

async function loadRepos(){
  try{
    const r = await fetch(`https://api.github.com/users/${DATA.github}/repos?per_page=100&sort=updated`);
    if(!r.ok) throw 0;
    repos = (await r.json()).filter(x=>!x.fork);
  }catch(e){ repoErr = true; }
  renderRepos();
}

let shown=[];
const slugify=x=>String(x).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const excludedRepos = new Set(["posappbackend","posappfront","myportfolio","kingdom-gym","kingdomgym"]);
function renderRepos(){
  const t = T[lang], box = $("#repos");
  const extra = DATA.extraProjects.map(o=>({...o, slug:slugify(o.title), text:o.desc[lang]}));
  let gh = [];
  if(repoErr){ box.innerHTML = ""; }
  if(repos) gh = repos.filter(r=>!excludedRepos.has(slugify(r.name))).map(r=>{ const o = DATA.projects[r.name]||{}; const title=o.title||r.name.replace(/[-_]/g," ");
    return {title, slug:slugify(r.name), text:(o.desc&&o.desc[lang])||r.description||"", tags:[r.language,...(r.topics||[]).slice(0,3)].filter(Boolean),
      repo:r.html_url, demo:o.demo, video:o.video, videoWebm:o.videoWebm, poster:o.poster, image:o.image}; });
  shown = [...extra, ...gh];
  const cards = shown.map((o,i)=>{
    const media = o.image ? `<img src="${esc(o.image)}" alt="${esc(o.title)}" loading="lazy">` : (o.video ? `<div class="project-media"><video class="project-preview" muted loop playsinline preload="metadata" width="960" height="540" poster="${esc(o.poster||"")}" data-project="${esc(o.slug)}" aria-label="${esc(o.demoLabel && o.demoLabel[lang] ? o.demoLabel[lang] : o.title + ' demo')}"><source src="${esc(o.videoWebm||o.video)}" type="video/webm"><source src="${esc(o.video||o.videoWebm)}" type="video/mp4"></video><span class="play-badge" aria-hidden="true"></span><noscript><img src="${esc(o.poster||"")}" alt="${esc(o.title)}" loading="lazy"></noscript></div>` : `<div class="project-media"><span class="project-fallback">${esc(o.title.slice(0,2).toUpperCase())}</span></div>`);
    return `<article class="card project-card" data-i="${i}" tabindex="0" aria-label="${esc(o.title)}"><div class="media">${media}</div><div class="body">
      <button type="button" class="project-title" data-i="${i}">${esc(o.title)}</button>
      <p>${esc(o.text)}</p><div class="tags">${(o.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>
      <div class="links"><span class="view">${t.open}</span>${o.repo?`<a href="${esc(o.repo)}" target="_blank" rel="noopener">${t.code}</a>`:""}${o.demo?`<a href="${esc(o.demo)}" target="_blank" rel="noopener">${t.demo}</a>`:""}</div></div></article>`;
  }).join("");
  const msg = repoErr ? `<p>${t.fail}</p>` : (!repos ? `<p>${t.loading}</p>` : "");
  box.innerHTML = cards + msg + `<p><a class="btn" href="https://github.com/${DATA.github}" target="_blank" rel="noopener">${t.all}</a></p>`;
}
async function openProject(i){
  const o=shown[i], t=T[lang], dlg=$("#pm"); if(!o) return;
  $("#pmT").textContent=o.title; $("#pmD").textContent=o.text;
  $("#pmG").innerHTML=(o.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("");
  $("#pmL").innerHTML=(o.repo?`<a href="${esc(o.repo)}" target="_blank" rel="noopener">${t.code}</a>`:"")+(o.demo?`<a href="${esc(o.demo)}" target="_blank" rel="noopener">${t.demo}</a>`:"");
  $("#pmN").innerHTML=""; $("#pmS").innerHTML=`<div class="empty">${t.loading}</div>`;
  dlg.showModal(); $("#pmS").scrollTop=0;
  let screens=[]; try{ const r=await fetch(`assets/projects/${o.slug}/manifest.json`); if(r.ok) screens=(await r.json()).screens||[]; }catch(e){}
  const demoNote = o.demoLabel && o.demoLabel[lang] ? o.demoLabel[lang] : `${o.title} demo recording`;
  const vid = o.video ? `<video class="project-dialog-video" src="${esc(o.video)}" poster="${esc(o.poster||"")}" width="960" height="540" controls muted playsinline aria-label="${esc(demoNote)}"><source src="${esc(o.videoWebm||o.video)}" type="video/webm"><source src="${esc(o.video||o.videoWebm)}" type="video/mp4"></video>` : "";
  if(!screens.length && !vid){ $("#pmS").innerHTML=`<div class="empty">${t.soon}</div>`; return; }
  $("#pmS").innerHTML = vid + screens.map((sc,k)=>`<figure id="sc${k}"><img src="assets/projects/${o.slug}/${esc(sc.file)}" alt="${esc(sc.label)}" loading="lazy"><figcaption>${esc(sc.label)}</figcaption></figure>`).join("");
  $("#pmN").innerHTML = screens.length>1 ? `<strong>${t.pages}</strong>`+screens.map((sc,k)=>`<button data-k="${k}">${esc(sc.label)}</button>`).join("") : "";
}

$("#pmX").addEventListener("click",()=>$("#pm").close());

$("#pmN").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) document.getElementById("sc"+b.dataset.k).scrollIntoView({behavior:"smooth",block:"start"}); });
function render(){
  const t = T[lang], d = DATA;
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  $("#fn").textContent = d.first; $("#ln").textContent = d.last;
  $("#role").textContent = d.role[lang]; $("#tag").textContent = d.tagline[lang];
  $("#cta").innerHTML = `<a class="btn p" href="#contact">${t.hire}</a><a class="btn" href="${esc(d.cv[lang])}" download>${t.cv}</a>`;

  $("#facts").innerHTML = `<div><small>${t.based}</small>${esc(d.location[lang])}</div>

    <div><small>LinkedIn</small><a href="${esc(d.linkedin)}">Firas Hakima</a></div>`;
  $("#pnote").textContent = t.pnote;
  $("#skillList").innerHTML = d.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join("");

    const years = e.years && typeof e.years === "object" ? e.years[lang] : (typeof e.years === "string" ? e.years.replace(/Aujourd'hui|Present|Heute|الآن/g, t.present) : "");
    return `<div class="item"><time>${esc(years)}</time><div><b>${esc(e.school)}</b><br>${esc(e.degree[lang])}</div></div>`;
  }).join("") || `<p>${t.none}</p>`;
  $("#expList").innerHTML = d.experience.map(e=>{
    const title = e.title && e.title[lang] ? e.title[lang] : "";
    const desc = e.desc && e.desc[lang] ? e.desc[lang] : "";
    return `<div class="item"><time>${esc(e.years)}</time><div><b>${esc(e.org)}</b> · ${esc(title)}${desc ? `<br>${esc(desc)}` : ""}</div></div>`;
  }).join("") || `<p>${t.none}</p>`;
  $("#certList").innerHTML = d.certs.map(c=>`<div class="item"><time>${esc(c.year)}</time><div><b>${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name)}</a>`:esc(c.name)}</b><br>${esc(c.issuer)}</div></div>`).join("") || `<p>${t.none}</p>`;
  $("#cp").textContent = t.cp;
  $("#cc").innerHTML = `<a class="btn p" href="mailto:${esc(d.email)}">${esc(d.email)}</a>
    <a class="btn" href="mailto:${esc(d.email2)}">${esc(d.email2)}</a>
    <a class="btn" href="${esc(d.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>
    <a class="btn" href="https://github.com/${d.github}" target="_blank" rel="noopener">GitHub</a>`;
  $("#foot").textContent = `© ${new Date().getFullYear()} ${d.first} ${d.last}`;
  document.title = `${d.first} ${d.last} — ${d.role[lang]}`;
  renderRepos();
}
$("#langs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;store.set("lang",lang);render();});
const hero=$("#hero");
const portraitImage = document.querySelector(".portrait img");
if (portraitImage) {
  portraitImage.addEventListener("error",()=>{
    const heroGrid = portraitImage.closest(".herogrid");
    if (heroGrid) heroGrid.classList.add("solo");
  });
}
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
const coarsePointer = window.matchMedia("(pointer: coarse)");
if (!reducedMotion.matches && !coarsePointer.matches) {
  let frameId = 0;
  hero.addEventListener("pointermove",e=>{
    cancelAnimationFrame(frameId);
    frameId = requestAnimationFrame(()=>{
      const r = hero.getBoundingClientRect();
      hero.style.setProperty("--sx",(e.clientX-r.left)+"px");
      hero.style.setProperty("--sy",(e.clientY-r.top)+"px");
    });
  });
}
const navToggle=$("#navToggle");
const navPanel=$("#navPanel");
const setNavOpen = open => {
  navPanel.classList.toggle("open", open);
  navToggle.setAttribute("aria-expanded", String(open));
};
navToggle.addEventListener("click",()=>setNavOpen(navToggle.getAttribute("aria-expanded") !== "true"));
$("#nav").addEventListener("click",()=>{
  if (window.matchMedia("(max-width: 760px)").matches) setNavOpen(false);
});
document.addEventListener("click",e=>{
  if (!navPanel.contains(e.target) && !navToggle.contains(e.target)) setNavOpen(false);
});
document.addEventListener("keydown",e=>{
  if (e.key === "Escape") setNavOpen(false);
});
if (!reducedMotion.matches) {
  const projectVideos = document.querySelectorAll(".project-preview");
  const projectObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const video = entry.target;
      if (!video) return;
      const media = video.closest(".project-media");
      if (entry.isIntersecting) {
        video.play().then(()=>{
          if (media) media.classList.add("is-video-ready");
        }).catch(()=>{});
      } else {
        video.pause();
        if (media) media.classList.remove("is-video-ready");
      }
    });
  }, {threshold: 0.25});
  projectVideos.forEach(video => {
    const media = video.closest(".project-media");
    if (media) media.classList.remove("is-video-ready");
    video.addEventListener("playing",()=> media && media.classList.add("is-video-ready"));
    video.addEventListener("pause",()=> media && media.classList.remove("is-video-ready"));
    projectObserver.observe(video);
  });
}
